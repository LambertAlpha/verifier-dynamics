# E005a constants (registry "E005a — pre-registration"; research/07_e005a_measurement.md). Scripts assert they match.
experiment_id = "E005a"
registry = "research/03_experiment_registry.md (E005a — pre-registration)"
design_doc = "research/07_e005a_measurement.md"
root_seed = 20261101
streams = ["design panel", "test panel", "design Monte Carlo", "test Monte Carlo"]

[panel]
variants = ["theta_0", "theta_hot", "theta_cold", "theta_lowA"]
doses = { null = 0.0, vsmall = 0.05, small = 0.2, medium = 0.6 }
d_extra = [0, 56]
max_target_redraws = 200

[budgets]
N = [32, 64, 128, 256, 512, 1024]
m = [4, 8]
unlabeled_per_audit = 1
R = 100

[estimators]
candidates = ["E0", "E1", "E2", "E3"]
metrics = ["I", "D", "F"]
primary_metric = "I"
damping = 0.1
interval = "estimate +- 1.96 jackknife SE (delete-one-group)"
null_test = "reject iff C2 - 1.645 SE > 0"

[selection]
metric = "I"
m = 8
N_ref = 256
tolerances = { sdb_rel = 0.20, null_abs = 0.02, spearman_abs = 0.02, rmse_rel = 0.10 }
order = ["E0", "E1", "E2", "E3"]

[solved]
sdb_max = 0.5
null_fpr_band = [0.02, 0.10]
null_fraction = 0.90
spearman_min = 0.8
power_min = 0.8
max_budget = 1024

[theory]
oracle_groups = 1000000
