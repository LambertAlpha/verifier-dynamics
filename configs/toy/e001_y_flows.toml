experiment_id = "E001"
title = "Y toy: vanilla vs natural gradient flows"
registry = "research/03_experiment_registry.md#e001"

[[initial_conditions]]
name = "IC1"
label = "q0 >> s0"
q0 = 0.30
s0 = 0.01

[[initial_conditions]]
name = "IC2"
label = "q0 ~ s0"
q0 = 0.10
s0 = 0.10

[[initial_conditions]]
name = "IC3"
label = "q0 << s0"
q0 = 0.01
s0 = 0.30

[horizon]
natural = 25.0
vanilla = 1.0e6

[solver]
method = "DOP853"
rtol = 1e-10
atol = 1e-12
t_min = 1e-3
n_eval = 400

# Tolerances: pre-run block of E001 plus Amendment 1 (both committed before execution).
[tolerances]
trajectory = 1e-7          # P1
natural_invariant = 1e-8   # P2
vanilla_invariant = 1e-6   # P2
endpoint = 1e-8            # P3
clock_free = 1e-5          # P4
switch_point = 1e-6        # P5, Amendment 1(a)
gap_rate_zero = 1e-13      # P5, Amendment 1(a)
diagnostic_atol = 1e-10    # P6
diagnostic_rtol = 1e-6     # P6
gap_identity_rtol = 1e-4   # P7
gap_identity_atol_frac = 1e-6  # P7, Amendment 1(b)

# Predictions copied from the E001 pre-run block (commit dff60a2). Values registered as
# fractions are written exactly; 6-decimal values are copied as registered.
[predictions.IC1]
vanilla_invariant_0 = -100.414489
natural_endpoint = [1.0, 0.03333333333333333]     # (1, 1/30)
delta_inf = 0.0
natural_gap_signs = "+-"
natural_switch = [0.5, 0.016666666666666666]      # (1/2, 1/60)
vanilla_gap_signs = "-"
vanilla_clock_free = ["q", 0.9999, 0.011397]      # when q = 1 - 1e-4, s = 0.011397

[predictions.IC2]
vanilla_invariant_0 = 0.0
natural_gap_signs = "+-"
natural_switch = [0.5, 0.5]
vanilla_gap_signs = "+-"
vanilla_switch = [0.5, 0.5]

[predictions.IC3]
vanilla_invariant_0 = 100.414489
natural_endpoint = [0.03333333333333333, 1.0]     # (1/30, 1)
delta_inf = 0.9666666666666667                    # 29/30
natural_gap_signs = "+"
vanilla_gap_signs = "+-"
vanilla_switch = [0.011364, 0.999871]
vanilla_clock_free = ["s", 0.9999, 0.011397]      # when s = 1 - 1e-4, q = 0.011397
