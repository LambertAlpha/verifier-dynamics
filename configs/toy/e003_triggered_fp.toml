experiment_id = "E003"
title = "Candidate 3: feature-triggered false positives matched on static metrics (natural gradient)"
registry = "research/03_experiment_registry.md#e003"

q0 = 0.001   # initial gold accuracy; u0 = logit(q0)
f = 0.01     # matched on-policy FPR for every structure

# Order = registered C(0) order (strictly increasing).
[[structures]]
name = "RFP"
kind = "random"

[[structures]]
name = "AND3"
kind = "and"
s0 = [0.2154434690031884, 0.2154434690031884, 0.2154434690031884]   # f^(1/3)

[[structures]]
name = "AND-SYM"
kind = "and"
s0 = [0.1, 0.1]

[[structures]]
name = "AND-MID"
kind = "and"
s0 = [0.04, 0.25]

[[structures]]
name = "AND-ASYM-A"
kind = "and"
s0 = [0.0125, 0.8]

[[structures]]
name = "AND-ASYM-B"
kind = "and"
s0 = [0.010204081632653062, 0.98]   # (f/0.98, 0.98)

[[structures]]
name = "OR"
kind = "or"
s0 = [0.005012562893380035, 0.005012562893380035]   # 1 - sqrt(1 - f)

[[structures]]
name = "SINGLE"
kind = "single"
s0 = [0.01]

[horizon]
natural = 500.0
vanilla = 1.0e6   # E003-V, exploratory only

[solver]
method = "DOP853"
rtol = 1e-10
atol = 1e-12
t_min = 1e-3
n_eval = 400
report_times = [10.0, 25.0, 100.0, 500.0]

[tolerances]   # registry E003 pre-run block
static = 1e-12            # P1
c0 = 1e-6                 # P2 (registered values have 6 decimals)
gold_race = 1e-7          # P3a, absolute in log J_G
success_gold = 1e-6       # P3b: J_G(T) >= 1 - tol
success_exploit = 1e-5    # P3b: |S(T) - S_inf|
stall_gold = 1e-3         # P3b: |J_G(T) - q_inf|
stall_exploit = 1e-2      # P3b: S(T) >= 1 - tol
invariant = 1e-7          # P6, relative, while 1 - s > 1e-9

